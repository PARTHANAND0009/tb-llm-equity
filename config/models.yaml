# Model configuration for RULE 5 — GENERATOR/EVALUATOR SEPARATION.
#
# generation.model/.family is the single model used to generate and critique
# vignettes. evaluation.models is the roster of models under evaluation.
# generation.family must never appear among evaluation.models[].family —
# src/tb_equity/config.py asserts this and raises otherwise.
#
# Left unconfigured (generation.model: null) until a generator is chosen.
# Any script that generates or critiques vignettes must fail loudly, not
# silently proceed, while this is unset — see
# tb_equity.config.require_generation_model().

generation:
  model: claude-code-agent
  family: anthropic
  temperature: 0.9
  top_p: 1.0
  max_tokens: 1600
  seed: 42

evaluation:
  # Superseded 2026-08-06: pivoted to a fully open-weight, zero-compute-
  # budget roster (see results/PREREGISTRATION.md Amendments). The prior
  # 5-model paid roster (gpt-5.5, gemini-3.1-pro-preview,
  # meta-llama/llama-4-maverick, mistral-large-2512, deepseek-v4-pro) is
  # kept only in git history, not here -- it was never actually run
  # (Phase 4 got only as far as a dry-run cost estimate before the pivot).
  #
  # runtime: colab_hf means this model is NOT called by scripts/run_arms.py
  # (the API harness) -- it's run by notebooks/open_weight_inference.ipynb
  # via local transformers (AutoModelForCausalLM + AWQ/bitsandbytes) inference
  # on a Colab T4, with no API key and no per-token cost. run_arms.py refuses
  # to run against a colab_hf entry rather than silently doing nothing.
  # (Originally vLLM -- switched 2026-08-07 after vLLM's CUDA-library
  # resolution failed twice live in this Colab image; see
  # results/PREREGISTRATION.md Amendments.)
  #
  # revision is the exact HuggingFace commit sha as of 2026-08-06 (verified
  # via the HF Hub API, not guessed) -- pinned so the RULE 1 manifest can
  # record precisely which weights were used. quantized_model/
  # quantized_revision point at a pre-quantized community checkpoint where
  # one exists, so the notebook downloads 4-bit weights directly instead of
  # quantizing on the fly; base_model/revision are the canonical HF repo
  # this model derives from, used for citation and for gated-access
  # bookkeeping (meta-llama/Llama-3.1-8B-Instruct is manually gated;
  # EPFLiGHT/Meditron3-8B is auto-gated -- both need an HF token that has
  # accepted the license, even though the pre-quantized Llama repo below is
  # itself ungated).
  models:
    - family: meta
      model: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
      revision: db1f81ad4b8c7e39777509fac66c652eb0a52f91
      base_model: meta-llama/Llama-3.1-8B-Instruct
      base_model_revision: 0e9e39f249a16976918f6564b8830bc894c89659
      base_model_gated: manual
      quantization: awq-int4
      params_b: 8
      runtime: colab_hf
    - family: qwen
      model: Orion-zhen/Qwen3-8B-AWQ
      revision: afb67fde7957c0e416d98b86df596016d94ea882
      base_model: Qwen/Qwen3-8B
      base_model_revision: b968826d9c46dd6066d109eabc6255188de91218
      base_model_gated: false
      quantization: awq-int4
      params_b: 8
      runtime: colab_hf
    - family: mistral
      model: solidrust/Mistral-7B-Instruct-v0.3-AWQ
      revision: 95b1295ddd1a8673117cdc7bd2a4da2a457bb3f7
      base_model: mistralai/Mistral-7B-Instruct-v0.3
      base_model_revision: c170c708c41dac9275d15a8fff4eca08d52bab71
      base_model_gated: false
      quantization: awq-int4
      params_b: 7
      runtime: colab_hf
    - family: epfl
      model: EPFLiGHT/Meditron3-8B
      revision: 783c241b18b84692689e0336170b345e5732e48e
      base_model: EPFLiGHT/Meditron3-8B  # no pre-quantized community checkpoint found
      base_model_revision: 783c241b18b84692689e0336170b345e5732e48e
      base_model_gated: auto
      quantization: bitsandbytes-nf4  # quantized on the fly, no AWQ checkpoint exists
      params_b: 8
      runtime: colab_hf
    # Added 2026-09-10 (Stage 2, Step 3): current-generation addition to the panel.
    # Verified via the HF Hub API on 2026-09-10, not guessed. Considered
    # mistralai/Ministral-3-8B-Instruct-2512 first (Apache 2.0, AWQ-quantized
    # community checkpoint exists) but rejected it: its config.json shows
    # architectures: ["Mistral3ForConditionalGeneration"] with a populated
    # vision_config -- it is a multimodal model requiring a different model
    # class than AutoModelForCausalLM, and its AWQ repo's quant_method is
    # "compressed-tensors" (llm-compressor/vLLM format), not the autoawq format
    # the rest of this roster's loader expects. Granite-4.2-8B has neither
    # problem (architectures: ["GraniteForCausalLM"], no vision_config, plain
    # bf16 checkpoint) and slots into the existing loader/notebook unchanged.
    - family: ibm
      model: ibm-granite/granite-4.2-8b
      revision: f8de16cdcdbc6c779ca517604e050d82cc119e44
      base_model: ibm-granite/granite-4.2-8b  # no pre-quantized checkpoint verified for this revision
      base_model_revision: f8de16cdcdbc6c779ca517604e050d82cc119e44
      base_model_gated: false
      quantization: bitsandbytes-nf4  # quantized on the fly, same pattern as epfl/Meditron3-8B
      params_b: 8
      runtime: colab_hf
      # batch_size is an infrastructure/throughput knob, not a sampling parameter --
      # it has no effect on any individual sequence's generated content (padding +
      # attention masking generate each sequence independently), so overriding it
      # per model does not compromise cross-model comparability the way varying
      # temperature/top_p/max_tokens would. Set to 1 here (Section 7's notebook
      # default is 4) based on real 2026-09-10 pilot evidence: Granite-4.2-8B
      # averaged 1562/1600 output tokens per response (vs. 434 for Llama, 201 for
      # Meditron) -- a batch of 4 simultaneous near-max-length generations needs
      # ~4x the KV-cache memory of one, on the same T4 that already OOM'd twice
      # during pilot model *loading* alone (see KNOWN_ISSUES.md-adjacent notebook
      # history). Not worth risking an OOM partway through the full run over.
      batch_size: 1
